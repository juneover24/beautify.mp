<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>短卡密扫码兑换</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #647084;
      --line: #d8deea;
      --accent: #1769e0;
      --accent-hover: #0f55bc;
      --danger: #b42318;
      --ok: #137333;
      --soft: #eef3fb;
      --shadow: 0 14px 40px rgba(18, 31, 56, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121620;
        --panel: #1b2230;
        --text: #eef3fb;
        --muted: #aab5c6;
        --line: #354052;
        --accent: #78a8ff;
        --accent-hover: #9bbfff;
        --danger: #ff9a91;
        --ok: #7bd88f;
        --soft: #202a3a;
        --shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .form-panel { padding: 22px; }
    .qr-panel { padding: 18px; }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: 0;
    }
    .subtle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: transparent;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    textarea {
      min-height: 108px;
      resize: vertical;
      overflow-wrap: anywhere;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 14px;
      min-height: 42px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.secondary {
      background: var(--soft);
      color: var(--text);
      border-color: var(--line);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .message {
      margin-top: 14px;
      min-height: 22px;
      font-size: 14px;
      line-height: 1.55;
    }
    .message.error { color: var(--danger); }
    .message.ok { color: var(--ok); }
    .qr-box {
      display: grid;
      place-items: center;
      min-height: 312px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--soft);
      overflow: auto;
    }
    .qr-box svg {
      width: min(280px, 100%);
      height: auto;
      background: #fff;
    }
    .qr-empty {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .meta span {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .link-output {
      margin-top: 14px;
    }
    .hidden { display: none; }
    @media (max-width: 760px) {
      main { width: min(100% - 20px, 960px); padding: 14px 0; }
      .shell { grid-template-columns: 1fr; }
      .form-panel, .qr-panel { padding: 16px; }
      h1 { font-size: 22px; }
      .qr-box { min-height: 280px; }
      .meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="shell">
      <section class="panel form-panel" aria-labelledby="title">
        <h1 id="title">短卡密扫码兑换</h1>
        <p class="subtle">本页只在浏览器本地加密短卡密并生成二维码，不上传卡密。</p>

        <label for="cardInput">短卡密</label>
        <input id="cardInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="SC_..." inputmode="text">

        <div class="actions">
          <button id="generateButton" class="primary" type="button">生成二维码</button>
          <button id="clearButton" class="secondary" type="button">清空</button>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div id="linkArea" class="link-output hidden">
          <label for="linkOutput">扫码链接</label>
          <textarea id="linkOutput" readonly></textarea>
          <div class="actions">
            <button id="copyButton" class="secondary" type="button">复制链接</button>
          </div>
        </div>
      </section>

      <aside class="panel qr-panel" aria-label="二维码">
        <div id="qrBox" class="qr-box">
          <div class="qr-empty">输入短卡密后生成二维码</div>
        </div>
        <div class="meta">
          <span>有效期：<strong id="ttlText">15 分钟</strong></span>
          <span>剩余：<strong id="countdownText">未生成</strong></span>
        </div>
      </aside>
    </div>
  </main>

  <script>
    'use strict';

    // 必须使用微信官方接口已经生成、目标页为 pages/pickup/pickup 的固定 URL Link。
    // 本页不会请求业务后端；它只把 SCE1 信封追加到 cq 参数，私钥解密仍由 server/runtime 完成。
    const FIXED_URL_LINK = 'https://wxmpurl.cn/HFE6wjRWeRc';
    const SCE1_KEY_ID = 'sce1-k1';
    const SCE1_PUBLIC_KEY_RAW_B64URL = 'BOKGJufChQFrjktaja8OSmZE0O0msS9gcKbbORNE7OtEDzrYGXZD_aBNIExsYa4CTNQ-wJULN0teW8A2m_K0rJQ';
    const SCE1_TTL_SECONDS = 15 * 60;
    const SCE1_HKDF_INFO = 'beautify.mp/card-short-link/SCE1';
    const SHORT_CARD_PATTERN = /^SC_[A-Za-z0-9]{1,16}$/;
    const textEncoder = new TextEncoder();

    const cardInput = document.getElementById('cardInput');
    const generateButton = document.getElementById('generateButton');
    const clearButton = document.getElementById('clearButton');
    const copyButton = document.getElementById('copyButton');
    const message = document.getElementById('message');
    const qrBox = document.getElementById('qrBox');
    const ttlText = document.getElementById('ttlText');
    const countdownText = document.getElementById('countdownText');
    const linkArea = document.getElementById('linkArea');
    const linkOutput = document.getElementById('linkOutput');
    let countdownTimer = 0;
    let currentExpiresAt = 0;

    function base64UrlToBytes(value) {
      const padded = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
      const binary = atob(padded);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) out[i] = binary.charCodeAt(i);
      return out;
    }

    function bytesToBase64Url(bytes) {
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function concatBytes(parts) {
      const total = parts.reduce((sum, part) => sum + part.length, 0);
      const out = new Uint8Array(total);
      let offset = 0;
      parts.forEach(part => {
        out.set(part, offset);
        offset += part.length;
      });
      return out;
    }

    function setMessage(text, type) {
      message.textContent = text || '';
      message.className = `message ${type || ''}`.trim();
    }

    function isUrlLinkConfigured() {
      return /^https:\/\/(?:wxaurl|wxmpurl)\.cn\/[A-Za-z0-9._~%-]+(?:[?#].*)?$/.test(FIXED_URL_LINK)
        && !FIXED_URL_LINK.includes('REPLACE_WITH_CARD_URL_LINK');
    }

    function buildLink(cq) {
      const separator = FIXED_URL_LINK.includes('?') ? '&' : '?';
      return `${FIXED_URL_LINK}${separator}cq=${encodeURIComponent(cq)}`;
    }

    async function encryptShortCard(shortCard) {
      const issuedAt = Math.floor(Date.now() / 1000);
      const issuedAtBase36 = issuedAt.toString(36);
      const header = `SCE1.${SCE1_KEY_ID}.${issuedAtBase36}`;
      const serverPublicKey = await crypto.subtle.importKey(
        'raw',
        base64UrlToBytes(SCE1_PUBLIC_KEY_RAW_B64URL),
        { name: 'ECDH', namedCurve: 'P-256' },
        false,
        []
      );
      const ephemeralKeyPair = await crypto.subtle.generateKey(
        { name: 'ECDH', namedCurve: 'P-256' },
        true,
        ['deriveBits']
      );
      const sharedBits = await crypto.subtle.deriveBits(
        { name: 'ECDH', public: serverPublicKey },
        ephemeralKeyPair.privateKey,
        256
      );
      const hkdfKey = await crypto.subtle.importKey('raw', sharedBits, 'HKDF', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'HKDF',
          hash: 'SHA-256',
          salt: textEncoder.encode(header),
          info: textEncoder.encode(SCE1_HKDF_INFO)
        },
        hkdfKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt']
      );
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv, additionalData: textEncoder.encode(header), tagLength: 128 },
        aesKey,
        textEncoder.encode(shortCard)
      ));
      const ephemeralPublic = new Uint8Array(await crypto.subtle.exportKey('raw', ephemeralKeyPair.publicKey));
      const blob = concatBytes([ephemeralPublic, iv, ciphertext]);
      return {
        cq: `${header}.${bytesToBase64Url(blob)}`,
        issuedAt,
        expiresAt: issuedAt + SCE1_TTL_SECONDS
      };
    }

    function resetQr() {
      qrBox.innerHTML = '<div class="qr-empty">输入短卡密后生成二维码</div>';
      linkArea.classList.add('hidden');
      linkOutput.value = '';
      countdownText.textContent = '未生成';
      currentExpiresAt = 0;
      if (countdownTimer) window.clearInterval(countdownTimer);
      countdownTimer = 0;
    }

    function updateCountdown() {
      if (!currentExpiresAt) return;
      const remaining = Math.max(0, currentExpiresAt - Math.floor(Date.now() / 1000));
      const minutes = Math.floor(remaining / 60);
      const seconds = String(remaining % 60).padStart(2, '0');
      countdownText.textContent = remaining > 0 ? `${minutes}:${seconds}` : '已过期';
      if (remaining <= 0 && countdownTimer) {
        window.clearInterval(countdownTimer);
        countdownTimer = 0;
        setMessage('二维码已过期，请重新生成。', 'error');
      }
    }

    async function onGenerate() {
      const shortCard = cardInput.value.trim();
      resetQr();
      if (!SHORT_CARD_PATTERN.test(shortCard)) {
        setMessage('请输入 SC_ 开头、总长度不超过 20 位的短卡密。', 'error');
        return;
      }
      if (!isUrlLinkConfigured()) {
        setMessage('固定 URL Link 尚未配置，请先在页面常量中填入真实 wxaurl.cn 链接。', 'error');
        return;
      }
      if (!crypto.subtle || !crypto.getRandomValues) {
        setMessage('当前浏览器不支持 Web Crypto，请更换现代浏览器。', 'error');
        return;
      }

      generateButton.disabled = true;
      setMessage('正在生成...', '');
      try {
        const envelope = await encryptShortCard(shortCard);
        if (envelope.cq.length > 240) {
          throw new Error('SCE1 链接参数超过 240 字符，请检查短卡密长度。');
        }
        const link = buildLink(envelope.cq);
        const qr = makeQrCode(link);
        qrBox.innerHTML = renderQrSvg(qr);
        linkOutput.value = link;
        linkArea.classList.remove('hidden');
        ttlText.textContent = '15 分钟';
        currentExpiresAt = envelope.expiresAt;
        updateCountdown();
        countdownTimer = window.setInterval(updateCountdown, 1000);
        setMessage('二维码已生成。', 'ok');
      } catch (error) {
        setMessage(error && error.message ? error.message : '生成失败，请重试。', 'error');
        resetQr();
      } finally {
        generateButton.disabled = false;
      }
    }

    async function copyLink() {
      if (!linkOutput.value) return;
      try {
        await navigator.clipboard.writeText(linkOutput.value);
        setMessage('链接已复制。', 'ok');
      } catch (error) {
        linkOutput.focus();
        linkOutput.select();
        document.execCommand('copy');
        setMessage('链接已复制。', 'ok');
      }
    }

    generateButton.addEventListener('click', () => { void onGenerate(); });
    clearButton.addEventListener('click', () => {
      cardInput.value = '';
      resetQr();
      setMessage('', '');
      cardInput.focus();
    });
    copyButton.addEventListener('click', () => { void copyLink(); });
    cardInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        void onGenerate();
      }
    });

    const QR_L_BLOCKS = {
      1: { ecc: 7, blocks: [19] },
      2: { ecc: 10, blocks: [34] },
      3: { ecc: 15, blocks: [55] },
      4: { ecc: 20, blocks: [80] },
      5: { ecc: 26, blocks: [108] },
      6: { ecc: 18, blocks: [68, 68] },
      7: { ecc: 20, blocks: [78, 78] },
      8: { ecc: 24, blocks: [97, 97] },
      9: { ecc: 30, blocks: [116, 116] },
      10: { ecc: 18, blocks: [68, 68, 69, 69] }
    };
    const QR_ALIGNMENT = {
      1: [],
      2: [6, 18],
      3: [6, 22],
      4: [6, 26],
      5: [6, 30],
      6: [6, 34],
      7: [6, 22, 38],
      8: [6, 24, 42],
      9: [6, 26, 46],
      10: [6, 28, 50]
    };

    const GF_EXP = new Array(512);
    const GF_LOG = new Array(256);
    (function initGaloisField() {
      let value = 1;
      for (let i = 0; i < 255; i += 1) {
        GF_EXP[i] = value;
        GF_LOG[value] = i;
        value <<= 1;
        if (value & 0x100) value ^= 0x11D;
      }
      for (let i = 255; i < 512; i += 1) GF_EXP[i] = GF_EXP[i - 255];
    })();

    function gfMultiply(left, right) {
      return left && right ? GF_EXP[GF_LOG[left] + GF_LOG[right]] : 0;
    }

    function reedSolomonDivisor(degree) {
      const result = new Array(degree).fill(0);
      result[degree - 1] = 1;
      let root = 1;
      for (let i = 0; i < degree; i += 1) {
        for (let j = 0; j < degree; j += 1) {
          result[j] = gfMultiply(result[j], root);
          if (j + 1 < degree) result[j] ^= result[j + 1];
        }
        root = gfMultiply(root, 2);
      }
      return result;
    }

    function reedSolomonRemainder(data, divisor) {
      const result = new Array(divisor.length).fill(0);
      data.forEach(byte => {
        const factor = byte ^ result.shift();
        result.push(0);
        for (let i = 0; i < result.length; i += 1) result[i] ^= gfMultiply(divisor[i], factor);
      });
      return result;
    }

    function appendBits(target, value, length) {
      for (let i = length - 1; i >= 0; i -= 1) target.push((value >>> i) & 1);
    }

    function buildDataCodewords(text, version, config) {
      const bytes = new TextEncoder().encode(text);
      const dataCodewords = config.blocks.reduce((sum, blockSize) => sum + blockSize, 0);
      const capacityBits = dataCodewords * 8;
      const countBits = version < 10 ? 8 : 16;
      const bits = [];
      appendBits(bits, 0x4, 4);
      appendBits(bits, bytes.length, countBits);
      bytes.forEach(byte => appendBits(bits, byte, 8));
      if (bits.length > capacityBits) return null;
      appendBits(bits, 0, Math.min(4, capacityBits - bits.length));
      while (bits.length % 8 !== 0) bits.push(0);
      const codewords = [];
      for (let i = 0; i < bits.length; i += 8) {
        let value = 0;
        for (let j = 0; j < 8; j += 1) value = (value << 1) | bits[i + j];
        codewords.push(value);
      }
      for (let pad = 0xEC; codewords.length < dataCodewords; pad ^= 0xEC ^ 0x11) codewords.push(pad);
      return codewords;
    }

    function addEccAndInterleave(dataCodewords, config) {
      const divisor = reedSolomonDivisor(config.ecc);
      const dataBlocks = [];
      const eccBlocks = [];
      let offset = 0;
      config.blocks.forEach(blockSize => {
        const block = dataCodewords.slice(offset, offset + blockSize);
        offset += blockSize;
        dataBlocks.push(block);
        eccBlocks.push(reedSolomonRemainder(block, divisor));
      });
      const result = [];
      const maxDataLength = Math.max(...dataBlocks.map(block => block.length));
      for (let i = 0; i < maxDataLength; i += 1) {
        dataBlocks.forEach(block => { if (i < block.length) result.push(block[i]); });
      }
      for (let i = 0; i < config.ecc; i += 1) eccBlocks.forEach(block => result.push(block[i]));
      return result;
    }

    function createMatrix(version) {
      const size = version * 4 + 17;
      return {
        version,
        size,
        modules: Array.from({ length: size }, () => new Array(size).fill(false)),
        functionModules: Array.from({ length: size }, () => new Array(size).fill(false))
      };
    }

    function setModule(matrix, x, y, dark, isFunction) {
      if (x < 0 || y < 0 || x >= matrix.size || y >= matrix.size) return;
      matrix.modules[y][x] = !!dark;
      if (isFunction) matrix.functionModules[y][x] = true;
    }

    function drawFinder(matrix, x, y) {
      for (let dy = -1; dy <= 7; dy += 1) {
        for (let dx = -1; dx <= 7; dx += 1) {
          const xx = x + dx;
          const yy = y + dy;
          const inCore = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6;
          const border = dx === 0 || dx === 6 || dy === 0 || dy === 6;
          const center = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
          setModule(matrix, xx, yy, inCore && (border || center), true);
        }
      }
    }

    function drawAlignment(matrix, centerX, centerY) {
      for (let dy = -2; dy <= 2; dy += 1) {
        for (let dx = -2; dx <= 2; dx += 1) {
          const distance = Math.max(Math.abs(dx), Math.abs(dy));
          setModule(matrix, centerX + dx, centerY + dy, distance !== 1, true);
        }
      }
    }

    function drawFunctionPatterns(matrix) {
      const size = matrix.size;
      drawFinder(matrix, 0, 0);
      drawFinder(matrix, size - 7, 0);
      drawFinder(matrix, 0, size - 7);
      const positions = QR_ALIGNMENT[matrix.version];
      positions.forEach(x => positions.forEach(y => {
        const nearTop = y <= 8;
        const nearLeft = x <= 8;
        const nearRight = x >= size - 9;
        if ((nearTop && nearLeft) || (nearTop && nearRight) || (!nearTop && nearLeft)) return;
        drawAlignment(matrix, x, y);
      }));
      for (let i = 8; i < size - 8; i += 1) {
        setModule(matrix, i, 6, i % 2 === 0, true);
        setModule(matrix, 6, i, i % 2 === 0, true);
      }
      drawFormatBits(matrix, 0);
      drawVersionBits(matrix);
      setModule(matrix, 8, size - 8, true, true);
    }

    function getBchFormatBits(mask) {
      let data = (1 << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i += 1) rem = (rem << 1) ^ (((rem >>> 9) & 1) ? 0x537 : 0);
      return ((data << 10) | rem) ^ 0x5412;
    }

    function drawFormatBits(matrix, mask) {
      const bits = getBchFormatBits(mask);
      const size = matrix.size;
      for (let i = 0; i <= 5; i += 1) setModule(matrix, 8, i, ((bits >>> i) & 1) !== 0, true);
      setModule(matrix, 8, 7, ((bits >>> 6) & 1) !== 0, true);
      setModule(matrix, 8, 8, ((bits >>> 7) & 1) !== 0, true);
      setModule(matrix, 7, 8, ((bits >>> 8) & 1) !== 0, true);
      for (let i = 9; i < 15; i += 1) setModule(matrix, 14 - i, 8, ((bits >>> i) & 1) !== 0, true);
      for (let i = 0; i < 8; i += 1) setModule(matrix, size - 1 - i, 8, ((bits >>> i) & 1) !== 0, true);
      for (let i = 8; i < 15; i += 1) setModule(matrix, 8, size - 15 + i, ((bits >>> i) & 1) !== 0, true);
    }

    function getBchVersionBits(version) {
      let rem = version;
      for (let i = 0; i < 12; i += 1) rem = (rem << 1) ^ (((rem >>> 11) & 1) ? 0x1F25 : 0);
      return (version << 12) | rem;
    }

    function drawVersionBits(matrix) {
      if (matrix.version < 7) return;
      const bits = getBchVersionBits(matrix.version);
      const size = matrix.size;
      for (let i = 0; i < 18; i += 1) {
        const bit = ((bits >>> i) & 1) !== 0;
        const a = size - 11 + (i % 3);
        const b = Math.floor(i / 3);
        setModule(matrix, a, b, bit, true);
        setModule(matrix, b, a, bit, true);
      }
    }

    function maskBit(mask, x, y) {
      switch (mask) {
        case 0: return (x + y) % 2 === 0;
        case 1: return y % 2 === 0;
        case 2: return x % 3 === 0;
        case 3: return (x + y) % 3 === 0;
        case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
        case 5: return ((x * y) % 2) + ((x * y) % 3) === 0;
        case 6: return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
        case 7: return (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
        default: return false;
      }
    }

    function placeData(matrix, codewords, mask) {
      const bits = [];
      codewords.forEach(codeword => appendBits(bits, codeword, 8));
      let bitIndex = 0;
      let upward = true;
      for (let right = matrix.size - 1; right >= 1; right -= 2) {
        if (right === 6) right -= 1;
        for (let vert = 0; vert < matrix.size; vert += 1) {
          const y = upward ? matrix.size - 1 - vert : vert;
          for (let dx = 0; dx < 2; dx += 1) {
            const x = right - dx;
            if (matrix.functionModules[y][x]) continue;
            const bit = (bits[bitIndex] || 0) ^ (maskBit(mask, x, y) ? 1 : 0);
            matrix.modules[y][x] = bit !== 0;
            bitIndex += 1;
          }
        }
        upward = !upward;
      }
    }

    function cloneMatrix(base) {
      return {
        version: base.version,
        size: base.size,
        modules: base.modules.map(row => row.slice()),
        functionModules: base.functionModules.map(row => row.slice())
      };
    }

    function calculatePenalty(matrix) {
      const size = matrix.size;
      let penalty = 0;
      for (let y = 0; y < size; y += 1) {
        let runColor = matrix.modules[y][0];
        let runLength = 1;
        for (let x = 1; x < size; x += 1) {
          if (matrix.modules[y][x] === runColor) runLength += 1;
          else {
            if (runLength >= 5) penalty += 3 + runLength - 5;
            runColor = matrix.modules[y][x];
            runLength = 1;
          }
        }
        if (runLength >= 5) penalty += 3 + runLength - 5;
      }
      for (let x = 0; x < size; x += 1) {
        let runColor = matrix.modules[0][x];
        let runLength = 1;
        for (let y = 1; y < size; y += 1) {
          if (matrix.modules[y][x] === runColor) runLength += 1;
          else {
            if (runLength >= 5) penalty += 3 + runLength - 5;
            runColor = matrix.modules[y][x];
            runLength = 1;
          }
        }
        if (runLength >= 5) penalty += 3 + runLength - 5;
      }
      for (let y = 0; y < size - 1; y += 1) {
        for (let x = 0; x < size - 1; x += 1) {
          const color = matrix.modules[y][x];
          if (color === matrix.modules[y][x + 1] && color === matrix.modules[y + 1][x] && color === matrix.modules[y + 1][x + 1]) penalty += 3;
        }
      }
      const patterns = ['10111010000', '00001011101'];
      for (let y = 0; y < size; y += 1) {
        const row = matrix.modules[y].map(value => value ? '1' : '0').join('');
        patterns.forEach(pattern => {
          let index = row.indexOf(pattern);
          while (index !== -1) {
            penalty += 40;
            index = row.indexOf(pattern, index + 1);
          }
        });
      }
      for (let x = 0; x < size; x += 1) {
        let column = '';
        for (let y = 0; y < size; y += 1) column += matrix.modules[y][x] ? '1' : '0';
        patterns.forEach(pattern => {
          let index = column.indexOf(pattern);
          while (index !== -1) {
            penalty += 40;
            index = column.indexOf(pattern, index + 1);
          }
        });
      }
      let dark = 0;
      matrix.modules.forEach(row => row.forEach(value => { if (value) dark += 1; }));
      const total = size * size;
      penalty += Math.floor(Math.abs((dark * 100 / total) - 50) / 5) * 10;
      return penalty;
    }

    function makeQrCode(text) {
      const bytes = new TextEncoder().encode(text);
      let version = 0;
      let config = null;
      let dataCodewords = null;
      for (let candidate = 1; candidate <= 10; candidate += 1) {
        const candidateConfig = QR_L_BLOCKS[candidate];
        if (candidate < 10 && bytes.length > 255) continue;
        const candidateData = buildDataCodewords(text, candidate, candidateConfig);
        if (candidateData) {
          version = candidate;
          config = candidateConfig;
          dataCodewords = candidateData;
          break;
        }
      }
      if (!config || !dataCodewords) throw new Error('二维码内容过长，请缩短固定 URL Link。');
      const codewords = addEccAndInterleave(dataCodewords, config);
      const base = createMatrix(version);
      drawFunctionPatterns(base);
      let best = null;
      let bestPenalty = Infinity;
      for (let mask = 0; mask < 8; mask += 1) {
        const candidate = cloneMatrix(base);
        placeData(candidate, codewords, mask);
        drawFormatBits(candidate, mask);
        const penalty = calculatePenalty(candidate);
        if (penalty < bestPenalty) {
          bestPenalty = penalty;
          best = candidate;
        }
      }
      return best;
    }

    function renderQrSvg(matrix) {
      const border = 4;
      const size = matrix.size + border * 2;
      const rects = [];
      for (let y = 0; y < matrix.size; y += 1) {
        for (let x = 0; x < matrix.size; x += 1) {
          if (matrix.modules[y][x]) rects.push(`<rect x="${x + border}" y="${y + border}" width="1" height="1"/>`);
        }
      }
      return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="短卡密兑换二维码" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#000">${rects.join('')}</g></svg>`;
    }
  </script>
</body>
