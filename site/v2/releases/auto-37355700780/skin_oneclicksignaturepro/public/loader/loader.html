  var windowsReserved = /^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i;
  if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]{0,399}$/.test(path)
    || path.indexOf('//') >= 0
    || segments.some(function unsafeSegment(segment) {
      return segment === '.' || segment === '..' || segment === '__proto__'
        || segment.slice(-1) === '.' || windowsReserved.test(segment);
    })) {
    throw new Error('logical path invalid');
  }
  return path;
}

async function sha256Hex(value) {
  var digest = new Uint8Array(await crypto.subtle.digest('SHA-256', value));
  return Array.from(digest, function hexByte(byte) {
    return byte.toString(16).padStart(2, '0');
  }).join('');
}

function equalList(left, right, field) {
  if (!Array.isArray(left) || left.length !== right.length) throw new Error(field + ' invalid');
  for (var index = 0; index < right.length; index += 1) {
    if (!hasOwn(left, index) || left[index] !== right[index]) throw new Error(field + ' invalid');
  }
}

// V3 票据放在 hash 的 toolLaunchTicket 参数里（与小程序 appendToolH5LaunchTicket
// 对应），读取后立即清除整个 fragment；location.search 的业务 query 保持原样。
function readTicketAndClearFragment() {
  var params = new URLSearchParams(global.location.hash.replace(/^#/, ''));
  var tickets = params.getAll('toolLaunchTicket');
  params.delete('toolLaunchTicket');
  var remaining = params.toString();
  var cleanUrl = global.location.pathname + global.location.search + (remaining ? '#' + remaining : '');
  global.history.replaceState(null, '', cleanUrl);
  if (tickets.length !== 1) throw new Error('launch ticket missing or ambiguous');
  var ticket = strictText(tickets[0], 'launch ticket', MAX_TICKET_BYTES);
  if (ticket.split('.').length !== 3) throw new Error('launch ticket invalid');
  return ticket;
}

function normalizeLaunchPathname(pathname) {
  // 入口可能是 /latest/<toolKey>/ 或被 WebView 规范化成 .../index.html；
  // 比较前统一去掉结尾的 index.html，保留尾斜杠与 claims.launchPath 对齐。
  return pathname.replace(/index\.html$/, '');
}

function parseTicket(ticket) {
  var segments = ticket.split('.');
  if (segments.length !== 3) throw new Error('launch ticket invalid');
  var header = JSON.parse(decoder.decode(bytesFromBase64Url(segments[0])));
  var claims = JSON.parse(decoder.decode(bytesFromBase64Url(segments[1])));
  if (bytesFromBase64Url(segments[2]).byteLength !== 64) throw new Error('ticket signature invalid');
  exactKeys(header, ['alg', 'kid', 'typ'], 'ticket header');
  // 阶段 4 双 schema（提案第十二节 12.1）：15 claims = 旧票（AAD v3）；11 claims =
  // 新票（去 mapVersion/releaseSetId/bootstrapVersion/profileDigest，AAD v4）。
  var claimCount = Object.keys(claims).length;
  var ticketSchema = claimCount === 15 ? 3 : (claimCount === 11 ? 4 : 0);
  if (ticketSchema === 3) {
    exactKeys(claims, [
      'aud', 'bootstrapVersion', 'entryPath', 'exp', 'iat', 'jti', 'launchPath',
      'manifestSha256', 'mapVersion', 'profileDigest', 'protocolFloor',
      'releaseId', 'releaseSetId', 'toolKey', 'v'
    ], 'ticket claims');
  } else if (ticketSchema === 4) {
    exactKeys(claims, [
      'aud', 'entryPath', 'exp', 'iat', 'jti', 'launchPath',
      'manifestSha256', 'protocolFloor', 'releaseId', 'toolKey', 'v'
    ], 'ticket claims');
  } else {
    throw new Error('ticket claims must be 15 (legacy) or 11 (new), got ' + claimCount);
  }
  if (header.alg !== 'ES256' || header.kid !== 'tool-h5-launch-v3' || header.typ !== 'JWT'
    || claims.v !== 3 || claims.aud !== V3_AUDIENCE || claims.protocolFloor !== 3
    || !/^[a-z][a-z0-9_]{0,63}$/.test(claims.toolKey)
    || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(claims.releaseId)
    || !/^[A-Za-z0-9_-]{1,256}$/.test(claims.jti)
    || !/^[0-9a-f]{64}$/.test(claims.manifestSha256)
    || claims.launchPath !== '/latest/' + claims.toolKey + '/'
    || !Number.isInteger(claims.iat) || !Number.isInteger(claims.exp)
    || claims.iat <= 0 || claims.exp <= claims.iat || claims.exp <= Math.floor(Date.now() / 1000)) {
    throw new Error('ticket claims invalid');
  }
  if (ticketSchema === 3) {
    // 过渡窗口：bootstrapVersion 收自身版本或 legacy 版本（见 V3_LEGACY_BOOTSTRAP_VERSIONS）；
    // map 系字段仅在旧票上校验。
    if ((claims.bootstrapVersion !== V3_BOOTSTRAP_VERSION
      && V3_LEGACY_BOOTSTRAP_VERSIONS.indexOf(claims.bootstrapVersion) < 0)
      || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(claims.mapVersion)
      || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(claims.releaseSetId)
      || !/^[0-9a-f]{64}$/.test(claims.profileDigest)) {
      throw new Error('ticket claims invalid');
    }
  }
  claims.__ticketSchema = ticketSchema;
  if (normalizeLaunchPathname(global.location.pathname) !== claims.launchPath) {
    throw new Error('ticket launch path mismatch');
  }
  var expectedEntryPrefix = '/v2/releases/' + claims.releaseId + '/' + claims.toolKey + '/';
  if (claims.entryPath.indexOf(expectedEntryPrefix) !== 0
    || safeLogicalPath(claims.entryPath.slice(expectedEntryPrefix.length)) !== profiles[claims.toolKey].entry.html) {
    throw new Error('ticket path binding invalid');
  }
  return claims;
}

async function readLimited(response, limit) {
  var rawLength = response.headers.get('content-length');
  if (rawLength && (!/^\d+$/.test(rawLength) || Number(rawLength) > limit)) {
    try { await response.body.cancel(); } catch (_) { /* release only */ }
    throw new Error('response is too large');
  }
  if (!response.body) return new Uint8Array();
  var reader = response.body.getReader();
  var chunks = [];
  var total = 0;
  try {
    while (true) {
      var item = await reader.read();
      if (item.done) break;
      total += item.value.byteLength;
      if (total > limit) {
        await reader.cancel('response size limit exceeded');
        throw new Error('response is too large');
      }
      chunks.push(item.value);
    }
  } finally {
    reader.releaseLock();
  }
  var output = new Uint8Array(total);
  var offset = 0;
  chunks.forEach(function copyChunk(chunk) {
    output.set(chunk, offset);
    offset += chunk.byteLength;
  });
  return output;
}

// V3 资源一律经 /latest/<toolKey>/<logicalPath> 代理：除 envelope POST 外，
// 所有同源 fetch 都必须携带票据头，网关验票后才代理到不可变 release。
async function fetchBytes(path, options, limit, ticket) {
  var url = new URL(path, global.location.origin);
  if (url.origin !== global.location.origin || url.hash) throw new Error('asset URL invalid');
  var headers = Object.assign({}, (options && options.headers) || {});
  if (ticket) headers[V3_TICKET_HEADER] = ticket;
  var response = await global.fetch(url.href, Object.assign({}, options || {}, {
    credentials: 'omit',
    redirect: 'error',
    headers: headers
  }));
  if (!response.ok) {
    try { await response.body.cancel(); } catch (_) { /* release only */ }
    throw new Error('v3 request rejected');
  }
  return readLimited(response, limit);
}

function normalizePublicJwk(value) {
  exactKeys(value, ['crv', 'kty', 'x', 'y'], 'ECDH public key');
  if (value.kty !== 'EC' || value.crv !== 'P-256'
    || bytesFromBase64Url(value.x).byteLength !== 32
    || bytesFromBase64Url(value.y).byteLength !== 32) {
    throw new Error('ECDH public key invalid');
  }
  return { kty: 'EC', crv: 'P-256', x: value.x, y: value.y };
}

// 与网关 handleV3EnvelopeRequest 的 aadContext 逐字段一致：这是 HKDF 的 info，
// 不是 AES-GCM additionalData（V3 envelope 的 DEK 包装不带 additionalData）。
function buildEnvelopeAadContext(claims, clientPublicKeyB64, serverPublicKeyJwk) {
  // 阶段 4 双 schema：15-claims 旧票走 aadVersion:3（15 字段）；11-claims 新票走
  // aadVersion:4（11 字段，无 map 系字段）。两端（loader/网关）按票据 claims 集合
  // 同步派生，HKDF info 逐字节一致才能解出同一把 KEK。
  var aadVersion = claims.__ticketSchema === 4 ? 4 : 3;
  var fields = [
    'aadVersion:' + aadVersion,
    'protocolVersion:3',
    'purpose:beautify.mp:v3:latest-dek-envelope',
    'ticketJti:' + (claims.jti || ''),
    'toolKey:' + claims.toolKey,
    'launchPath:' + claims.launchPath,
    'releaseId:' + claims.releaseId,
    'entryPath:' + claims.entryPath,
    'manifestSha256:' + claims.manifestSha256
  ];
  if (aadVersion === 3) {
    fields.push(
      'mapVersion:' + claims.mapVersion,
      'releaseSetId:' + claims.releaseSetId,
      'bootstrapVersion:' + claims.bootstrapVersion,
      'profileDigest:' + claims.profileDigest
    );
  }
  fields.push('clientPublicKey:' + clientPublicKeyB64);
  fields.push('serverPublicKey:' + serverPublicKeyJwk.x + ':' + serverPublicKeyJwk.y);
  return fields.join('|');
}

async function requestEnvelope(ticket, claims) {
  var pair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    false,
    ['deriveBits']
  );
  if (pair.privateKey.extractable !== false) throw new Error('ECDH private key must be non-extractable');
  var exported = new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey));
  var clientPublicKeyB64 = bytesToBase64Url(exported);
  var raw = await fetchBytes('/v3/envelopes', {
    method: 'POST',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      protocolVersion: 3,
      ticket: ticket,
      clientPublicKey: clientPublicKeyB64
    })
  }, MAX_ENVELOPE_BYTES);
  var payload = JSON.parse(decoder.decode(raw));
  var legacyEnvelope = typeof payload.mapVersion === 'string';
  if (legacyEnvelope) {
    exactKeys(payload, [
      'bootstrapVersion', 'envelope', 'entryPath', 'expiresAt', 'launchPath',
      'manifestSha256', 'manifestVerifyPublicKey', 'mapVersion', 'profileDigest',
      'protocolVersion', 'releaseId', 'releaseSetId', 'success', 'toolKey'
    ], 'envelope response');
  } else {
    exactKeys(payload, [
      'envelope', 'entryPath', 'expiresAt', 'launchPath',
      'manifestSha256', 'manifestVerifyPublicKey',
      'protocolVersion', 'releaseId', 'success', 'toolKey'
    ], 'envelope response');
  }
  if (payload.success !== true) throw new Error('envelope response failed');
  exactKeys(payload.envelope, [
    'aadVersion', 'iv', 'kdf', 'serverPublicKey', 'tag', 'wrapAlg', 'wrappedDEK'
  ], 'DEK envelope');
  if (payload.protocolVersion !== 3 || payload.toolKey !== claims.toolKey
    || payload.releaseId !== claims.releaseId || payload.launchPath !== claims.launchPath
    || payload.entryPath !== claims.entryPath || payload.manifestSha256 !== claims.manifestSha256
    || !Number.isInteger(payload.expiresAt) || payload.expiresAt < Math.floor(Date.now() / 1000)
    || payload.envelope.kdf !== 'HKDF-SHA-256' || payload.envelope.wrapAlg !== 'A256GCM'
    || payload.envelope.aadVersion !== (legacyEnvelope ? 3 : 4)) {
    throw new Error('envelope binding invalid');
  }
  if (legacyEnvelope && (payload.mapVersion !== claims.mapVersion
    || payload.releaseSetId !== claims.releaseSetId
    || payload.bootstrapVersion !== claims.bootstrapVersion
    || payload.profileDigest !== claims.profileDigest)) {
    throw new Error('envelope binding invalid');
  }
  // manifest 验签公钥来自网关 crypto.subtle.exportKey('jwk')，恒定六字段。
  exactKeys(payload.manifestVerifyPublicKey, ['crv', 'ext', 'key_ops', 'kty', 'x', 'y'], 'manifest verify key');
  if (payload.manifestVerifyPublicKey.kty !== 'EC' || payload.manifestVerifyPublicKey.crv !== 'P-256'
    || payload.manifestVerifyPublicKey.ext !== true
    || !Array.isArray(payload.manifestVerifyPublicKey.key_ops)
    || payload.manifestVerifyPublicKey.key_ops.length !== 1
    || payload.manifestVerifyPublicKey.key_ops[0] !== 'verify'
    || bytesFromBase64Url(payload.manifestVerifyPublicKey.x).byteLength !== 32
    || bytesFromBase64Url(payload.manifestVerifyPublicKey.y).byteLength !== 32) {
    throw new Error('manifest verify key invalid');
  }
  var manifestVerifyKey = await crypto.subtle.importKey(
    'jwk', payload.manifestVerifyPublicKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']
  );
  var serverPublicKey = normalizePublicJwk(payload.envelope.serverPublicKey);
  var importedServerKey = await crypto.subtle.importKey(
    'jwk', serverPublicKey, { name: 'ECDH', namedCurve: 'P-256' }, false, []
  );
  var sharedSecret = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'ECDH', public: importedServerKey }, pair.privateKey, 256
  ));
  var aadContext = encoder.encode(
    buildEnvelopeAadContext(claims, clientPublicKeyB64, serverPublicKey)
  );
  var iv = bytesFromBase64Url(payload.envelope.iv);
  var wrappedDek = bytesFromBase64Url(payload.envelope.wrappedDEK);
  var tag = bytesFromBase64Url(payload.envelope.tag);
  // 网关把 wrapKey 输出的 ciphertext||tag 拆成两个字段下发，解包前重新拼接。
  if (iv.byteLength !== 12 || tag.byteLength !== 16
    || wrappedDek.byteLength < 32 || wrappedDek.byteLength > 64) {
    throw new Error('envelope bytes invalid');
  }
  var hkdfKey = await crypto.subtle.importKey('raw', sharedSecret, 'HKDF', false, ['deriveKey']);
  sharedSecret.fill(0);
  var kek = await crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: new Uint8Array(0), info: aadContext },
    hkdfKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['unwrapKey']
  );
  var combined = new Uint8Array(wrappedDek.byteLength + tag.byteLength);
  combined.set(wrappedDek, 0);
  combined.set(tag, wrappedDek.byteLength);
  var dek = await crypto.subtle.unwrapKey(
    'raw',
    combined,
    kek,
    { name: 'AES-GCM', iv: iv, tagLength: 128 },
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  if (dek.extractable !== false) throw new Error('release DEK must be non-extractable');
  return { dek: dek, manifestVerifyKey: manifestVerifyKey };
}

function validateManifest(value, claims, profile) {
  exactKeys(value, [
    'aad', 'createdAt', 'enc', 'entry', 'recipients', 'releaseId',
    'routes', 'schemaVersion', 'signature', 'toolKey'
  ], 'manifest');
  if (value.schemaVersion !== 2 || value.releaseId !== claims.releaseId
    || value.toolKey !== claims.toolKey || value.enc !== 'A256GCM'
    || typeof value.createdAt !== 'string' || value.createdAt.length > 64
    || !Number.isFinite(Date.parse(value.createdAt))) {
    throw new Error('manifest identity invalid');
  }
  exactKeys(value.aad, ['fields', 'version'], 'manifest AAD');
  var aadFields = [
    'releaseId', 'toolKey', 'logicalPath', 'part.id', 'part.kind',
    'part.mime', 'part.bytes', 'part.sha256'
  ];
  if (value.aad.version !== 2) throw new Error('manifest AAD invalid');
  equalList(value.aad.fields, aadFields, 'manifest AAD fields');
  exactKeys(value.entry, ['html', 'scripts', 'styles', 'workers'], 'manifest entry');
  if (value.entry.html !== profile.entry.html) throw new Error('manifest entry invalid');
  equalList(value.entry.styles, profile.entry.styles, 'manifest styles');
  equalList(value.entry.scripts, profile.entry.scripts, 'manifest scripts');
  equalList(value.entry.workers, profile.entry.workers, 'manifest workers');

  if (!Array.isArray(value.recipients) || value.recipients.length < 1 || value.recipients.length > 32) {
    throw new Error('manifest recipients invalid');
  }
  var recipientKids = new Set();
  value.recipients.forEach(function validateRecipient(recipient) {
    exactKeys(recipient, ['alg', 'kid', 'label', 'wrappedKey'], 'manifest recipient');
    var wrapped = bytesFromBase64(recipient.wrappedKey);
    if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(recipient.kid)
      || recipientKids.has(recipient.kid) || recipient.alg !== 'RSA-OAEP-256'
      || recipient.label !== 'beautify.mp:v2:' + claims.releaseId + ':' + claims.toolKey
      || wrapped.byteLength < 128 || wrapped.byteLength > 1024) {
      throw new Error('manifest recipient invalid');
    }
    recipientKids.add(recipient.kid);
  });

  if (!isRecord(value.routes)) throw new Error('manifest routes invalid');
  var expectedKinds = Object.create(null);
  profile.owned.forEach(function markOwned(path) { expectedKinds[path] = 'owned'; });
  profile.vendor.forEach(function markVendor(path) { expectedKinds[path] = 'vendor'; });
  // 阶段 4 loader 资产化（提案第十二节 12.2）：release 自带的 loader 路由为可选——
  // 存在时按 vendor 校验（含 sha256）；迁移期旧 manifest 无此路由照样通过。
  if (value.routes['loader/loader.html']) expectedKinds['loader/loader.html'] = 'vendor';
  // 阶段 4 loader 资产化（提案第十二节 12.2）：release 自带的 loader 路由为可选——
  // 存在时按 vendor 校验（含 sha256）；迁移期旧 manifest 无此路由照样通过。
  if (value.routes['_loader/loader.html']) expectedKinds['_loader/loader.html'] = 'vendor';
  var routePaths = Object.keys(value.routes).sort();
  var expectedPaths = Object.keys(expectedKinds).sort();
  equalList(routePaths, expectedPaths, 'manifest routes');
  var partIds = new Set();
  routePaths.forEach(function validateRoute(logicalPath) {
    if (safeLogicalPath(logicalPath) !== logicalPath) throw new Error('manifest route path invalid');
    var route = value.routes[logicalPath];
    exactKeys(route, ['cacheMode', 'mime', 'parts'], 'manifest route');
    var mime = strictText(route.mime, 'route MIME', 200);
    if (/\r|\n/.test(mime) || !Array.isArray(route.parts) || route.parts.length !== 1) {
      throw new Error('manifest route invalid');
    }
    var part = route.parts[0];
    var kind = expectedKinds[logicalPath];
    var common = ['bytes', 'id', 'kind', 'mime', 'sha256'];
    exactKeys(part, kind === 'owned'
      ? common.concat(['aadVersion', 'cipherPath', 'cipherSha256', 'iv'])
      : common.concat(['publicPath']), 'manifest part');
    if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(part.id) || partIds.has(part.id)
      || part.kind !== kind || part.mime !== mime
      || !Number.isSafeInteger(part.bytes) || part.bytes < 0 || part.bytes > MAX_ASSET_BYTES
      || !/^[0-9a-f]{64}$/.test(part.sha256)
      || route.cacheMode !== (kind === 'owned' ? 'no-store' : 'immutable')) {
      throw new Error('manifest part invalid');
    }
    partIds.add(part.id);
    if (kind === 'owned') {
      if (part.aadVersion !== 2 || !/^[0-9a-f]{64}$/.test(part.cipherSha256)
        || part.cipherPath !== 'cipher/' + part.cipherSha256 + '.bin'
        || bytesFromBase64(part.iv).byteLength !== 12) {
        throw new Error('owned manifest part invalid');
      }
    } else if (part.publicPath !== 'public/' + logicalPath) {
      throw new Error('vendor manifest part invalid');
    }
  });

  exactKeys(value.signature, ['alg', 'kid', 'value'], 'manifest signature');
  if (value.signature.alg !== 'ES256'
    || !/^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$/.test(value.signature.kid)
    || bytesFromBase64(value.signature.value).byteLength !== 64) {
    throw new Error('manifest signature invalid');
  }
  return value;
}

function assetAad(manifest, logicalPath, part) {
  return encoder.encode(canonicalize({
    v: 2,
    releaseId: manifest.releaseId,
    toolKey: manifest.toolKey,
    logicalPath: logicalPath,
    part: {
      id: part.id,
      kind: part.kind,
      mime: part.mime,
      bytes: part.bytes,
      sha256: part.sha256
    }
  }));
}

async function loadManifest(claims, profile, prefix, ticket, manifestVerifyKey) {
  var raw = await fetchBytes(prefix + '/manifest.json', {
    method: 'GET', cache: 'no-store', headers: { Accept: 'application/json' }
  }, MAX_MANIFEST_BYTES, ticket);
  if (await sha256Hex(raw) !== claims.manifestSha256) throw new Error('manifest hash mismatch');
  var parsed = JSON.parse(decoder.decode(raw));
  var manifest = validateManifest(parsed, claims, profile);
  var unsigned = Object.assign({}, parsed);
  delete unsigned.signature;
  var verified = await crypto.subtle.verify(
    { name: 'ECDSA', hash: 'SHA-256' },
    manifestVerifyKey,
    bytesFromBase64(manifest.signature.value),
    encoder.encode(canonicalize(unsigned))
  );
  if (!verified) throw new Error('manifest signature invalid');
  return manifest;
}

async function materializeRoute(prefix, ticket, manifest, logicalPath, dek) {
  var route = manifest.routes[logicalPath];
  var part = route.parts[0];
  var raw;
  if (part.kind === 'vendor') {
    raw = await fetchBytes(prefix + '/' + part.publicPath, { method: 'GET', cache: 'force-cache' }, part.bytes, ticket);
    if (raw.byteLength !== part.bytes || await sha256Hex(raw) !== part.sha256) {
      throw new Error('vendor integrity mismatch');
    }
    return raw;
  }
  var cipher = await fetchBytes(prefix + '/' + part.cipherPath, { method: 'GET', cache: 'force-cache' }, part.bytes + 16, ticket);
  if (cipher.byteLength !== part.bytes + 16 || await sha256Hex(cipher) !== part.cipherSha256) {
    throw new Error('cipher integrity mismatch');
  }
  raw = new Uint8Array(await crypto.subtle.decrypt({
    name: 'AES-GCM',
    iv: bytesFromBase64(part.iv),
    additionalData: assetAad(manifest, logicalPath, part),
    tagLength: 128
  }, dek, cipher));
  if (raw.byteLength !== part.bytes || await sha256Hex(raw) !== part.sha256) {
    throw new Error('plaintext integrity mismatch');
  }
  return raw;
}

async function materializeRelease(prefix, ticket, manifest, profile, dek) {
  var retained = new Set(profile.retained);
  var assets = new Map();
  var queue = Array.from(retained);
  var cursor = 0;
  async function consume() {
    while (cursor < queue.length) {
      var index = cursor;
      cursor += 1;
      var logicalPath = queue[index];
      var bytes = await materializeRoute(prefix, ticket, manifest, logicalPath, dek);
      if (retained.has(logicalPath)) assets.set(logicalPath, bytes);
    }
  }
  await Promise.all([consume(), consume(), consume()]);
  if (assets.size !== retained.size) throw new Error('required release asset missing');
  return assets;
}

function textAsset(assets, manifest, logicalPath, mimePrefixes) {
  var bytes = assets.get(logicalPath);
  var route = manifest.routes[logicalPath];
  if (!bytes || !route) throw new Error('text asset missing');
  var mime = route.mime.toLowerCase();
  if (!mimePrefixes.some(function allowed(prefix) { return mime.indexOf(prefix) === 0; })) {
    throw new Error('text asset MIME invalid');
  }
  return decoder.decode(bytes);
}

function replaceOnce(source, needle, replacement, field) {
  var first = source.indexOf(needle);
  if (first < 0 || source.indexOf(needle, first + needle.length) >= 0) {
    throw new Error(field + ' compatibility marker invalid');
  }
  return source.slice(0, first) + replacement + source.slice(first + needle.length);
}

/**
 * 页面脚本用 '../font-marker-local/marker.worker.js' 这类兄弟目录相对路径创建 Worker。
 * V3 页面位于 '/latest/<toolKey>/'，'../' 会退到 '/latest/' 级；把 '/latest/' 级下

function normalizeDownloadBridgeScript(source, logicalPath) {

  // download_info 现在会返回滚动节点（如 123295.com / pd1.cjjd19.com），旧
  // 资产因此在 validateDownloadUrl 处误报“服务器未返回有效下载地址”。不能改写
  // immutable release 的密文文件，改由版本化 loader 在执行旧脚本前做一次精确兼容
  // 替换；替换后的校验仍保留 HTTPS、无 userinfo、标准 443 端口和合法主机检查。
  // 使用 ASCII 正则定位完整函数，避免旧资产的中文错误文案因不同编码或压缩形式

    + '\n  const parsed = parseStrictHttpsUrl(value);'

    + '\n  return parsed.href;'

    /const PAN123_DOWNLOAD_HOST_SUFFIXES = \['123pan\.com', '123pan\.cn'\];\r?\n?/,

var WEIXIN_SCRIPT_PATH = 'font-adjustment-local/vendor/jweixin-1.6.0.js';

  if (claims.toolKey !== 'download_bridge') {

  // bridge 门禁：真实微信注入 bridge 可能晚于页面脚本启动，提前 reject 会只显示

function renderFailure() {
  document.title = '安全启动失败';
  while (document.head.firstChild) document.head.removeChild(document.head.firstChild);
  while (document.body.firstChild) document.body.removeChild(document.body.firstChild);
  var main = document.createElement('main');
  main.setAttribute('role', 'alert');
  main.style.cssText = 'max-width:32rem;margin:18vh auto;padding:24px;font:16px/1.7 sans-serif;color:#1f2937;';
  var title = document.createElement('h1');
  title.textContent = '安全启动失败';
  var detail = document.createElement('p');
  detail.textContent = '当前加密工具无法安全加载，请返回小程序后重试。';
  main.appendChild(title);
  main.appendChild(detail);
  document.body.appendChild(main);
}

var ticket;
try {
  // fragment 票据在任何异步操作、网络请求或业务脚本执行前读取并立即清除。
  ticket = readTicketAndClearFragment();
} catch (_) {
  renderFailure();
  return;
}

(async function bootstrap() {

  var profile = profiles[claims.toolKey];

  // 不把已从 fragment 移除的票据重新暴露给业务 realm；gate 只暴露已验签的非敏感

  installVideoFallbackCapability(claims, ticket);
  ticket = '';
  // 原生桥捕获：web-view 宿主（真实微信/开发者工具）可能在页面加载时注入原生
  // wx.miniProgram，而 jweixin-1.6.0 作为入口脚本会用 WeixinJSBridge 门控版本
  // 整体覆写 window.wx——开发者工具不派发 WeixinJSBridgeReady，覆写后原生通道
  // 永久失效。这里在覆写前留档，业务 H5 经 __J24_NATIVE_WX__ 恢复原生返回通道。

    var nativeWx = global.wx || null;
    if (nativeWx && nativeWx.miniProgram && typeof nativeWx.miniProgram.postMessage === 'function') {

    } else {

    }

  installWorkerResolver(claims, prefix, profile, manifest, assets);
  // 页面侧 fetch 拦截必须在业务脚本执行前安装；font_compress 的字集/探测依赖它。
  installPageSideFetchResolver(claims, prefix, profile, manifest, assets);
  installDocument(htmlSource, profile.entry.styles, assets, manifest);
  await executeEntryScripts(claims, profile, assets, manifest);
